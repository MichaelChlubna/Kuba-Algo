name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start the stack with sample data
        run: |
          docker compose build
          docker compose run --rm init
          docker compose up -d web
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          curl -fsS localhost:8000/api/meta > /dev/null
          curl -fsS localhost:8000/ | grep -q "<title>Deltaprint"
          curl -fsS localhost:8000/manual/ | grep -q "<title>Deltaprint"
          curl -fsSL localhost:8000/app | grep -q '<div id="root">'
      - if: always()
        run: docker compose logs web; docker compose down -v
